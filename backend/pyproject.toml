[project]
name = "backend"
version = "0.1.0"
description = "BodhCode Backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langsmith>=0.14.12",
    "lingua-language-detector>=2.2.0",
    "networkx>=3.7",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]
