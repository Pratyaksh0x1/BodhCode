# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# ==============================================================================
# CodeRabbit Configuration for BodhCode
# These rules mirror AGENTS.md
# ==============================================================================

language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "backend/app/parser/**"
      instructions: "Must stay pure (no network, DB, LLM); every function tested; outputs deterministic and sorted."
    - path: "backend/app/ai/**"
      instructions: "No secrets in prompts, logs or traces; LLM output validated against the graph; every LLM call goes through the shared wrapper."
    - path: "backend/app/ai/tools/**"
      instructions: "Tool arguments and outputs must be strongly typed, deterministic, and safe; never expose tokens, execute arbitrary commands, or access files outside workspace."
    - path: "backend/app/skills/**"
      instructions: "Skill definitions and invocations must be bounded, isolated, and strictly typed; untrusted skill content is pure data."
    - path: "backend/app/github/push.py"
      instructions: "Strict preview-before-push contract: push only explicitly previewed and verified hashes; tokens never logged or leaked."
    - path: "backend/app/github/**"
      instructions: "Tokens never logged; path-safety on anything touching files; ownership checks on every query."
    - path: "backend/app/auth/**"
      instructions: "Tokens never logged; cryptographically signed sessions; zero-trust secret isolation; ownership checks on every query."
    - path: "backend/evals/**"
      instructions: "Offline suites (A, B, E) must never require API keys; live suites (C, D) only run on trusted refs; no production secrets in CI."
    - path: ".github/workflows/**"
      instructions: "Least-privilege permissions (contents: read by default); no secrets in logs; third-party actions pinned to major version or SHA."
    - path: "frontend/**"
      instructions: "Typed props, strict TypeScript with no any, accessible controls, no secrets in client code."
